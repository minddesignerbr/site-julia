backend:
  name: git-gateway
  branch: main
  site_domain: sunny-gelato-edf8cc.netlify.app

site_url: https://juliaalencar.com

media_folder: "img/blog"
public_folder: "/img/blog"

collections:
  - name: "blog"
    label: "Blog"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Foto de capa", name: "thumbnail", widget: "image", required: false }
      - { label: "Resumo", name: "excerpt", widget: "string" }
      - { label: "Conteúdo", name: "body", widget: "markdown" }
