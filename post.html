    /* Creme #F6F2EB · Bege #DCCFBE · Azul #6F8290 · Marrom #5C4338 · Vinho #7A3B43 · Oliva #8C9A7D */

    .post-header {
      padding: 8rem 0 3rem;
      background: #F6F2EB;
      text-align: center;
      border-bottom: 1px solid #DCCFBE;
    }
    .post-header .label {

      margin-bottom: 1rem;
    }
    .post-header h1 {

      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 300;
      color: #5C4338;
      max-width: 760px;
      margin: 0 auto 1.5rem;
      line-height: 1.2;
    }
    .post-date {
      font-size: 0.85rem;
      color: #6F8290;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .post-body {
      max-width: 720px;
      margin: 0 auto;
      padding: 4rem 2rem 6rem;
      color: #5C4338;
      font-size: 1.05rem;
      line-height: 1.85;
    }
    .post-body h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.6rem, 2.5vw, 2.2rem);
      font-weight: 300;
      color: #5C4338;
      margin: 3rem 0 1rem;
      line-height: 1.2;
      border-left: 3px solid #7A3B43;
      padding-left: 1rem;
    }
    .post-body p {
      margin-bottom: 1.5rem;
      color: #5C4338;
    }
    .post-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #6F8290;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 3rem;
      transition: color 0.2s;
      text-decoration: none;
    }
    .post-back:hover { color: #7A3B43; }
    .post-cta {
      margin-top: 4rem;
      padding: 3rem;
      border-top: 1px solid #DCCFBE;
      text-align: center;
      background: #DCCFBE;
      border-radius: 8px;
    }
    .post-cta p {
      color: #5C4338;
      margin-bottom: 1.5rem;
      font-size: 1rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 300;
    }
    .post-cta .btn-primary {
      background: #7A3B43;
      color: #F6F2EB;
      padding: 1rem 2.5rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-radius: 2px;
      font-weight: 500;
      display: inline-block;
      transition: background 0.2s;
    }
    .post-cta .btn-primary:hover { background: #5a2830; }
    .post-loading {
      text-align: center;
      padding: 6rem 2rem;
      color: #6F8290;
    }

  <script src="js/main.js?v=5"></script>
  <script>
    async function loadPost() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      const container = document.getElementById('post-container');

      if (!slug) {
        window.location.href = '/blog';
        return;
      }

      try {
        const res = await fetch(
          `https://api.github.com/repos/minddesignerbr/site-julia/contents/_posts/${slug}.md`,
          { headers: { 'Accept': 'application/vnd.github.v3+json' } }
        );

        if (!res.ok) throw new Error('Post não encontrado');

        const data = await res.json();
        const text = atob(data.content.replace(/\n/g, ''));
        const post = parsePostFull(text);

        document.title = `${post.title} · Júlia Alencar`;

        container.innerHTML = `
          <section class="post-header">
            <div class="container">
              <span class="label">Blog</span>
              <h1>${escapeHtml(post.title)}</h1>
              <div class="post-date">${formatDate(post.date)}</div>
            </div>
          </section>
          <div class="post-body">
            <a href="/blog" class="post-back">← Voltar para o blog</a>
            ${post.body}
            <div class="post-cta">
              <p>Gostou desse conteúdo? Se quiser conversar sobre o que está sentindo, estou aqui.</p>
              <a href="https://wa.me/5521990695000" class="btn btn-primary" target="_blank" rel="noopener">Agendar sua consulta</a>
            </div>
          </div>
        `;
      } catch (e) {
        container.innerHTML = '<div class="post-loading">Artigo não encontrado.</div>';
      }
    }

    function parsePostFull(text) {
      const frontmatter = {};
      const fmMatch = text.match(/^---\n([\s\S]*?)\n---/);
      let body = text;
      if (fmMatch) {
        fmMatch[1].split('\n').forEach(line => {
          const [key, ...val] = line.split(': ');
          if (key && val.length) frontmatter[key.trim()] = val.join(': ').trim().replace(/^"|"$/g, '');
        });
        body = text.replace(/^---\n[\s\S]*?\n---\n/, '');
      }
      return {
        title: frontmatter.title || 'Sem título',
        date: frontmatter.date || '',
        body: markdownToHtml(body),
      };
    }

    function markdownToHtml(md) {
      return md
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/\n\n/g, '</p><p>')
        .replace(/^(?!<h[23]>)(.+)$/gm, (match) => {
          if (match.startsWith('<')) return match;
          return match;
        })
        .split('\n\n')
        .map(block => {
          if (block.startsWith('<h2>') || block.startsWith('<h3>')) return block;
          if (block.trim() === '') return '';
          return `<p>${block}</p>`;
        })
        .join('\n');
    }

    loadPost();
  </script>
